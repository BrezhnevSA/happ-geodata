name: Build HAPP geodata

on:
  workflow_dispatch:

  schedule:
    - cron: "30 3,9,15,21 * * *"

permissions:
  contents: write

concurrency:
  group: happ-geodata
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # REPOSITORY
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7

      # ----------------------------------------------------------
      # GEOSITE
      # ----------------------------------------------------------

      - name: Checkout domain-list-community
        uses: actions/checkout@v7
        with:
          repository: v2fly/domain-list-community
          path: community

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: community/go.mod
          cache: false

      - name: Add RunetFreedom lists
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 3 \
            "https://community.antifilter.download/list/domains.lst" \
            --output community/data/antifilter-download-community

          curl \
            --fail \
            --location \
            --retry 3 \
            "https://raw.githubusercontent.com/1andrevich/Re-filter-lists/main/domains_all.lst" \
            --output community/data/refilter

          curl \
            --fail \
            --location \
            --retry 3 \
            "https://raw.githubusercontent.com/runetfreedom/russia-domains-list/main/ru-available-only-inside" \
            --output community/data/ru-available-only-inside

          cat > community/data/ru-blocked <<'EOF'
          include:antifilter-download-community
          include:refilter
          EOF

      - name: Build minimal geosite.dat
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p publish

          cd community

          go run ./ \
            --datapath=./data \
            --datprofile=../geosite-profile.json \
            --outputdir=../publish

          cd ..

          test -s publish/geosite.dat

      # ----------------------------------------------------------
      # GEOIP
      # ----------------------------------------------------------

      - name: Checkout GeoIP tool
        uses: actions/checkout@v7
        with:
          repository: v2fly/geoip
          path: geoip-tool

      - name: Build minimal geoip.dat
        shell: bash
        run: |
          set -euo pipefail

          cd geoip-tool

          go run ./ \
            -c ../geoip-config.json

          cd ..

          test -s publish/geoip.dat

      # ----------------------------------------------------------
      # CHECKSUMS
      # ----------------------------------------------------------

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          cd publish

          sha256sum geosite.dat > geosite.dat.sha256sum
          sha256sum geoip.dat > geoip.dat.sha256sum

          echo
          echo "Generated files:"
          du -h geosite.dat geoip.dat

          echo
          echo "Checksums:"
          cat geosite.dat.sha256sum
          cat geoip.dat.sha256sum

      # ----------------------------------------------------------
      # RELEASE BRANCH
      # ----------------------------------------------------------

      - name: Publish release branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cd publish

          git init

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b release

          git add .

          git commit \
            -m "Update geodata $(date -u +'%Y-%m-%d %H:%M UTC')"

          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push \
            --force \
            origin release

      # ----------------------------------------------------------
      # GITHUB RELEASE
      # ----------------------------------------------------------

      - name: Publish latest GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          FILES=(
            "publish/geosite.dat"
            "publish/geoip.dat"
            "publish/geosite.dat.sha256sum"
            "publish/geoip.dat.sha256sum"
          )

          if gh release view latest >/dev/null 2>&1; then

            echo "Updating existing latest release..."

            gh release upload \
              latest \
              "${FILES[@]}" \
              --clobber

            gh release edit \
              latest \
              --title "HAPP geodata - latest" \
              --notes "Automatically updated: $(date -u +'%Y-%m-%d %H:%M UTC')"

          else

            echo "Creating latest release..."

            gh release create \
              latest \
              "${FILES[@]}" \
              --target main \
              --title "HAPP geodata - latest" \
              --notes "Automatically generated geodata for HAPP." \
              --latest

          fi
